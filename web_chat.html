<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>SpendLens 가계부 비서</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #262638; border-bottom: 1px solid #3a3a52;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8b8bd8; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .steps {
    max-width: 70%; font-size: 12px; color: #9a9ac0; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: #7ee787; }
  .prompt-box {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    max-width: 70%; margin-top: -4px; background: #17171f; border: 1px solid #3a3a52;
    border-radius: 10px; font-size: 12px; overflow: hidden;
  }
  .prompt-box summary {
    cursor: pointer; padding: 7px 12px; color: #8b8bd8; user-select: none;
    list-style: none;
  }
  .prompt-box summary::-webkit-details-marker { display: none; }
  .prompt-box summary::before { content: "🔍 "; }
  .prompt-box[open] summary::before { content: "🔽 "; }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid #3a3a52;
    background: #11111a; color: #c3c3e0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; max-height: 320px; overflow-y: auto;
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #262638; border-top: 1px solid #3a3a52; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 14px;
  }
  input:focus { outline: 1px solid #5b5bd6; }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; background: #5b5bd6;
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a3a52; cursor: default; }
  /* 승인 카드 (예산 변경 같은 저장 조치) */
  .approval {
    flex-shrink: 0; max-width: 70%; background: #2a2333; border: 1px solid #b07a2a;
    border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
  }
  .approval h4 { margin: 0 0 6px; font-size: 14px; color: #f0b25a; }
  .approval li { margin: 2px 0; }
  .approval .actions { display: flex; gap: 8px; margin-top: 10px; }
  .approval .approve { background: #2f8f4e; }
  .approval .reject { background: #a33a3a; }
  .approval .decided { margin-top: 8px; color: #c9c9e8; }
</style>
</head>
<body>
<div id="app">
  <header>SpendLens · 가계부 비서 <span>{{ backendLabel }}</span></header>
  <div id="log" ref="logEl">
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'steps'" class="steps">
        <div v-for="(step, i) in item.steps" :key="i" class="step" :class="{ done: item.done }">{{ step }}</div>
      </div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'approval'" class="approval">
        <h4>⏸ 승인 필요 — 저장되는 조치 {{ item.actions.length }}건</h4>
        <ul><li v-for="(a, i) in item.actions" :key="i"><b>{{ a.action }}</b>: {{ a.sentence }}</li></ul>
        <div v-if="item.decided === null" class="actions">
          <button class="approve" @click="decide(item, true)">승인</button>
          <button class="reject" @click="decide(item, false)">거절</button>
        </div>
        <div v-else class="decided">{{ item.decided ? '✅ 승인함' : '⛔ 거절함' }}</div>
      </div>

      <details v-else-if="item.kind === 'prompt'" class="prompt-box">
        <summary>LLM에 전달된 최종 프롬프트 보기</summary>
        <pre>{{ item.text }}</pre>
      </details>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <input
      v-model="input"
      autocomplete="off"
      placeholder="예: 9월 식비 얼마 썼어? / 구독 정리해 줘 / 식비 예산 50만원으로 바꿔줘"
    />
    <button type="submit" :disabled="sending">보내기</button>
  </form>
</div>

<!-- 버전 고정: vue@3처럼 쓰면 배포 시점마다 다른 버전이 내려온다 -->
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, nextTick } = Vue;

const TOOL_NAMES = {
  spending_summary: '지출 합계', category_breakdown: '카테고리별 합계', compare_months: '월 비교',
  list_transactions: '결제 목록', detect_anomalies: '이상 결제 탐지', find_subscriptions: '정기 결제 찾기',
  budget_status: '예산 대비 현황',
};

const STEP_LABELS = {
  RouteDecided: e => e.route === 'refuse' ? '범위 밖 질문(투자 등) → 정중히 안내' : null,
  IntentsFilled: e => `질문 의도 보충(LLM): ${e.intents.join(', ')}`,
  PlanCreated: e => e.missing_months ? `데이터에 없는 기간: ${e.missing_months.join(', ')}`
      : e.clarify ? `예산 변경 정보 부족 → ${e.clarify} 되묻기`
      : `계획: ${e.month ?? '전체 기간'} · ${e.calls.map(t => TOOL_NAMES[t] ?? t).join(', ')}`,
  MerchantsClassified: e => `규칙에 없는 가맹점 ${Object.keys(e.labels).length}곳 자동 분류: `
      + Object.entries(e.labels).map(([m, c]) => `${m}→${c}`).join(', '),
  ToolCalled: e => `  · ${TOOL_NAMES[e.tool] ?? e.tool} 조회` + (e.retries ? ' (재시도 성공)' : ''),
  GuidesRetrieved: e => `절약 가이드 검색 → ${e.topics.join(', ')}`,
  DraftWritten: e => `답변 작성 (시도 ${e.attempt})`,
  Validation: e => e.verdict === '합격' ? '금액 검증 통과'
      : e.verdict.startsWith('합격') ? '검증 최대 횟수 도달 → 경고와 함께 통과'
      : '금액 검증 반려 → 다시 작성' + (e.grounding_issues?.length ? ' (근거 없는 숫자)' : ''),
  ChangeProposed: e => `예산 변경 제안: ${e.category} → ${e.amount.toLocaleString()}원`,
  ApprovalDecided: e => e.approved ? '승인 → 예산 변경 실행' : '거절 → 변경하지 않음',
  MemorySummarized: e => `대화가 길어져 이전 ${e.summarized}개 메시지를 요약해 저장`,
  Finalize: () => '답변 완성',
};

createApp({
  setup() {
    const backendLabel = ref('SpendLens');
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    // 새로고침해도 같은 대화를 이어가도록 thread_id를 브라우저에 보관
    let thread = null;
    try { thread = localStorage.getItem('spendlens_thread_id'); } catch {}
    if (!thread) {
      thread = 't-web-' + Math.random().toString(36).slice(2, 8);
      try { localStorage.setItem('spendlens_thread_id', thread); } catch {}
    }
    let nextId = 0;

    fetch('/health').then(r => r.json()).then(h => {
      backendLabel.value = `${h.llm_backend} (${h.fast_llm} / ${h.quality_llm}) · 데이터 ${h.months?.[0]} ~ ${h.months?.at(-1)}`;
    }).catch(() => {});

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text) return;

      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [], done: false, failed: false });
      log.value.push(stepsItem);
      scrollToBottom();

      runStream(`/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`, stepsItem);
    }

    // 승인 카드의 버튼 → 멈춘 그래프를 이어서 실행하는 스트림을 연다
    function decide(item, approved) {
      item.decided = approved;
      sending.value = true;
      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [], done: false, failed: false });
      log.value.push(stepsItem);
      runStream(`/chat/approve/stream?thread_id=${encodeURIComponent(thread)}&approved=${approved}`, stepsItem);
    }

    // SSE 한 번을 처리한다 — 새 질문(/chat/stream)과 승인 후 재개(/chat/approve/stream)가 같이 쓴다
    function runStream(url, stepsItem) {
      const es = new EventSource(url);
      let streamItem = null;
      let streamAttempt = null;   // write_node 재작성(attempt 증가) 시 새 말풍선으로 끊는다

      es.onmessage = (event) => {
        if (event.data === '[DONE]') {
          es.close(); sending.value = false;
          stepsItem.done = !stepsItem.failed;   // 끝난 단계를 ✓로 (오류로 끝났으면 그대로)
          return;
        }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }

        if (e.type === 'ApprovalRequired') {   // 그래프가 멈췄다 → 승인 카드 표시
          // (예산 변경 제안문은 코드가 쓰고 토큰으로 흘려보내지 않으므로, 승인 전에 확정 답처럼 보이는 말풍선이 없다)
          log.value.push(reactive({ id: nextId++, kind: 'approval', actions: e.actions, decided: null }));
          stepsItem.steps.push('예산 변경 → 승인 대기');
          scrollToBottom();
          return;
        }

        if (e.type === 'Error') {   // 서버 오류를 화면에 보여준다
          log.value.push({ id: nextId++, kind: 'agent', text: '⚠️ 처리 중 오류: ' + e.message });
          stepsItem.failed = true;   // 오류로 끝난 단계는 ✓로 바꾸지 않는다
          stepsItem.steps.push('오류로 중단됨');
          scrollToBottom();
          return;
        }

        if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => {
        es.close();
        if (sending.value) {   // [DONE] 전에 끊겼다면 = 백엔드가 꺼졌거나 프록시 오류
          log.value.push({ id: nextId++, kind: 'agent', text: '⚠️ 서버와 연결이 끊겼습니다. 백엔드가 떠 있는지 확인하세요.' });
          scrollToBottom();
        }
        sending.value = false;
      };
    }

    return { backendLabel, log, input, sending, logEl, onSubmit, decide };
  },
}).mount('#app');
</script>
</body>
</html>
